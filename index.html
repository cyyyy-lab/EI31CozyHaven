<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和i可親｜i人友善 Discord 社群</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2e;
            --accent-color: #7289da;
            --accent-hover: #5b73c7;
            --text-main: #e0e6ed;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(114, 137, 218, 0.15);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 35px;
            text-align: left;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px;
            border-radius: 12px;
        }

        .feature-item h3 {
            font-size: 1rem;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .feature-item p {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .btn-join {
            display: inline-block;
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-join:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">🏷️ 伺服器標籤：和 i 可親</div>
        <h1>歡迎來到我們的基地 (⁠・⁠∀⁠・⁠)</h1>
        <p class="subtitle">
            這是一個集結了許多「i 人」的 Discord 社群。<br>
            不論你是內向的 I 人還是活潑的 E 人，都能在這裡找到最舒服的社交步調。
        </p>

        <div class="features">
            <div class="feature-item">
                <h3>💬 隨心交流</h3>
                <p>想聊天就聊，不想說話也可以安靜潛水打卡。</p>
            </div>
            <div class="feature-item">
                <h3>🎮 組隊打台</h3>
                <p>輕鬆開團找隊友，沒有壓力一起玩遊戲。</p>
            </div>
            <div class="feature-item">
                <h3>📻 24H 音樂</h3>
                <p>常設 Lofi 音樂語音房，一個人掛機也不孤單。</p>
            </div>
        </div>

        <!-- 這裡換成你的 Discord 邀請網址 -->
        <a href="https://discord.gg/ie31inviteyou" class="btn-join" target="_blank">點擊加入 Discord 伺服器 🚀</a>

        <div class="footer-note">希望你能在這裡找到屬於自己的小天地 ✨</div>
    </div>

</body>
</html>
