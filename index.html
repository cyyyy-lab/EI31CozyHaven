<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>環境音播放器</title>
  <style>
    .player-card {
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 8px;
      width: 280px;
      font-family: sans-serif;
    }
    .sound-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .sound-item button {
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="player-card">
  <h3>環境音播放器</h3>
  <div id="sound-list"></div>
</div>

<script>
  // 音效資料清單：僅保留「雨聲」與「街道音」
  const sounds = [
    { id: 'rain', name: '雨聲', icon: '🌧️', src: 'https://actions.google.com/sounds/v1/weather/rain_heavy_loud.ogg' },
    { id: 'street', name: '街道音', icon: '🏙️', src: 'https://actions.google.com/sounds/v1/ambiences/outdoor_city_traffic.ogg' }
  ];

  const soundListContainer = document.getElementById('sound-list');

  // 動態生成播放器控制介面
  sounds.forEach(sound => {
    const itemDiv = document.createElement('div');
    itemDiv.className = 'sound-item';

    itemDiv.innerHTML = `
      <span>${sound.icon} ${sound.name}</span>
      <audio id="audio-${sound.id}" loop src="${sound.src}"></audio>
      <button onclick="toggleAudio('${sound.id}')" id="btn-${sound.id}">播放</button>
    `;

    soundListContainer.appendChild(itemDiv);
  });

  // 控制播放 / 暫停
  function toggleAudio(id) {
    const audio = document.getElementById(`audio-${id}`);
    const btn = document.getElementById(`btn-${id}`);

    if (audio.paused) {
      audio.play();
      btn.textContent = '暫停';
    } else {
      audio.pause();
      btn.textContent = '播放';
    }
  }
</script>

</body>
</html>
